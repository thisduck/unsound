name: build dmg

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0). Leave empty for a test build (artifact only, no release)."
        required: false
        default: ""

concurrency:
  group: macos-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: macOS dmg (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release version"; exit 1; }
            if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" > /dev/null; then
              draft=$(gh release view "v$RELEASE_VERSION" --json isDraft --jq '.isDraft')
              [ "$draft" = true ] || { echo "This release is already published; choose a new version."; exit 1; }
              git fetch origin "refs/tags/v$RELEASE_VERSION:refs/tags/v$RELEASE_VERSION"
              git checkout --detach "v$RELEASE_VERSION"
              echo "resume=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Configure OpenSSL
        run: echo "CMAKE_PREFIX_PATH=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: dmg

      - name: Bump version
        if: inputs.version != '' && steps.source.outputs.resume != 'true'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/bump-version.py "$RELEASE_VERSION"

      - name: Install frontend dependencies
        run: npm ci

      - name: Write notarization API key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build app and dmg (signed + notarized)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: npm run tauri build

      - name: Upload dmg artifact (test build)
        if: inputs.version == ''
        uses: actions/upload-artifact@v4
        with:
          name: unsound-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Preserve signed release files
        if: inputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-files
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

      # Tag only after the signed build succeeds. Never rebase after building:
      # a concurrent main push must fail, rather than tag unbuilt code.
      - name: Commit and tag release
        if: inputs.version != '' && steps.source.outputs.resume != 'true'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "release v$RELEASE_VERSION"
          git tag "v$RELEASE_VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$RELEASE_VERSION"

      - name: Publish release and signed update feed
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RESUMING: ${{ steps.source.outputs.resume }}
        run: |
          notes="release-notes/$RELEASE_VERSION.md"
          if [ "$RESUMING" = true ]; then
            echo "Completing the existing draft release"
          elif [ -f "$notes" ]; then
            gh release create "v$RELEASE_VERSION" --draft --verify-tag \
              --title "unsound v$RELEASE_VERSION" --notes-file "$notes"
          else
            gh release create "v$RELEASE_VERSION" --draft --verify-tag \
              --title "unsound v$RELEASE_VERSION" --generate-notes
          fi
          # Draft releases are not available through the REST tag lookup.
          gh release view "v$RELEASE_VERSION" --json body,tagName,createdAt \
            --jq '{body: .body, tag_name: .tagName, created_at: .createdAt}' > "$RUNNER_TEMP/release.json"
          python3 scripts/update-manifest.py "$RELEASE_VERSION" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/release.json" --output "$RUNNER_TEMP/latest.json"
          gh release upload "v$RELEASE_VERSION" --clobber \
            src-tauri/target/release/bundle/dmg/*.dmg \
            src-tauri/target/release/bundle/macos/*.app.tar.gz \
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig \
            "$RUNNER_TEMP/latest.json"
          gh release edit "v$RELEASE_VERSION" --draft=false --latest
