name: reliability

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      native_ui:
        description: Run native UI tests (requires the CrabNebula repository secret)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  faults:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure OpenSSL
        run: echo "CMAKE_PREFIX_PATH=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: npm run test:reliability

  native-ui:
    if: github.event_name == 'workflow_dispatch' && inputs.native_ui
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CN_API_KEY_WEBDRIVER: ${{ secrets.CN_API_KEY_WEBDRIVER }}
    steps:
      - uses: actions/checkout@v4
      - name: Require native driver credentials
        run: |
          if [ -z "$CN_API_KEY_WEBDRIVER" ]; then
            echo "CN_API_KEY_WEBDRIVER is required; no native tests ran."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure OpenSSL
        run: echo "CMAKE_PREFIX_PATH=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run e2e:build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-ui-failures
          path: e2e/artifacts/
          if-no-files-found: ignore
